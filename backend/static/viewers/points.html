<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D 실내 스캔</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  #info {
    position: absolute; top: 12px; left: 12px; right: 12px; max-width: 420px;
    background: rgba(0,0,0,.6); padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
  }
  #info b { font-size: 15px; }
  #info button { margin-top: 6px; padding: 5px 10px; border-radius: 6px; border: 1px solid #666; background: #222; color: #eee; cursor: pointer; }
  #info a { color: #9cf; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">
  <b id="title">3D 스캔</b><br />
  <span id="status">불러오는 중...</span><br />
  마우스 드래그: 회전 · 휠: 확대 · 오른쪽 드래그: 이동
  <div>
    <button id="size-down">점 작게</button>
    <button id="size-up">점 크게</button>
    <button id="reset">시점 초기화</button>
    <a href="/">← 지도로</a>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PLYLoader } from "three/addons/loaders/PLYLoader.js";

// ?scan=e8_3f → /api/v1/scans/files/e8_3f.ply, /scans/e8_3f.json(제목, 설명)
const scan = new URLSearchParams(location.search).get("scan") || "e8_3f";
const base = location.protocol.startsWith("http") ? "" : "http://localhost:8000";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const material = new THREE.PointsMaterial({ size: 0.03, vertexColors: true, sizeAttenuation: true });
let home = null;

function fit(geom) {
  geom.computeBoundingSphere();
  const { center, radius } = geom.boundingSphere;
  // 사람 눈높이처럼 조금 위에서 비스듬히 보기
  camera.position.copy(center).add(new THREE.Vector3(0, radius * 0.6, radius * 1.2));
  camera.near = radius / 1000; camera.far = radius * 20; camera.updateProjectionMatrix();
  controls.target.copy(center);
  material.size = radius / 300;
  home = { pos: camera.position.clone(), target: center.clone() };
}

fetch(`${base}/api/v1/scans/files/${scan}.json`).then(r => r.ok ? r.json() : null).then(meta => {
  if (meta) document.getElementById("title").textContent = meta.title;
}).catch(() => {});

new PLYLoader().load(`${base}/api/v1/scans/files/${scan}.ply`, (geom) => {
  // prepare_scan.py가 이미 +Y가 위가 되도록 회전해 둠
  scene.add(new THREE.Points(geom, material));
  fit(geom);
  document.getElementById("status").textContent =
    `점 ${geom.attributes.position.count.toLocaleString()}개 · 영상에서 복원 (COLMAP)`;
}, (xhr) => {
  if (xhr.total) document.getElementById("status").textContent = `불러오는 중... ${Math.round(xhr.loaded / xhr.total * 100)}%`;
}, () => {
  document.getElementById("status").textContent = "⚠ 스캔 파일을 불러오지 못했습니다. http://localhost:8000 에서 열었는지 확인하세요.";
});

document.getElementById("size-up").onclick = () => { material.size *= 1.4; };
document.getElementById("size-down").onclick = () => { material.size /= 1.4; };
document.getElementById("reset").onclick = () => {
  if (!home) return;
  camera.position.copy(home.pos); controls.target.copy(home.target);
};
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
