[project]
name = "hyeonpung-map-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10,<4",
    "pyjwt>=2.9",       # DB 파트: JWT
    "tzdata>=2024.1",   # DB 파트: Windows 에서도 zoneinfo 시간대
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # 줄 길이는 formatter 가 담당 / B008: FastAPI Depends 기본값

[tool.ruff.lint.per-file-ignores]
# 3D 스캔 학습·변환 스크립트(김도현): 수식 변수 l(길이) 그대로 둔다
"scripts/train_gsplat.py" = ["E741"]
"scripts/prepare_scan.py" = ["E741"]
"tests/test_route.py" = ["UP031"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
# starlette TestClient 가 httpx2 로 옮기라는 안내 경고 (현재 버전에선 동작 문제 없음)
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
